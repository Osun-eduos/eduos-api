# Render Blueprint for an Osun EduOS pilot: database, API and sync service. The web app is on Cloudflare Pages
# (see wrangler.toml in eduos-web) and reaches the API through its own /api address.
# In Render: New > Blueprint > choose this repository. Render asks for the values marked `sync: false`.
# Guide: https://github.com/Osun-eduos/osun-eduos/blob/main/docs/deployment.md
#
# Addresses (if Render gives a service a different address because the name is taken, update API_ORIGIN in
# eduos-web/wrangler.toml and the mobile app's server addresses):
#   Web app:       https://osun-eduos-app.pages.dev (Cloudflare Pages)
#   API:           https://osun-eduos-api.onrender.com
#   Sync service:  https://osun-eduos-sync.onrender.com

databases:
  - name: osun-eduos-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: eduos
    user: eduos
    # Reachable only from these services over Render's private network.
    ipAllowList: []

services:
  - type: web
    name: osun-eduos-api
    runtime: docker
    repo: https://github.com/Osun-eduos/eduos-api
    branch: main
    region: frankfurt
    plan: 0.5c-512mb
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: osun-eduos-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://osun-eduos-app.pages.dev
      - key: COOKIE_SECURE
        value: "true"
      # Two proxies sit in front of the API for web users: Cloudflare (the web app's /api) and Render.
      - key: TRUST_PROXY
        value: "2"
      - key: LOGIN_RATE_LIMIT
        value: "60"
      # First Ministry administrator, created on first start only. Choose a temporary password; it must be
      # changed at first sign-in. Delete these three values in Render after signing in.
      - key: SEED_ADMIN_NAME
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Absence texts to parents through KudiSMS. Until the token and sender ID are set, texts are only logged.
      - key: KUDISMS_TOKEN
        sync: false
      - key: KUDISMS_SENDER_ID
        sync: false
      - key: KUDISMS_ROUTE
        value: corporate
      - key: ABSENCE_SMS_DELAY_MINUTES
        value: "15"
      # Push notifications to the parent app (Firebase service account JSON). Without it, parents still get the inbox and SMS.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Inspection photos in S3-compatible storage (Cloudflare R2, Backblaze B2 or AWS S3).
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: osun-eduos-sync
    runtime: docker
    repo: https://github.com/Osun-eduos/eduos-sync
    branch: main
    region: frankfurt
    plan: 0.5c-512mb
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: osun-eduos-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        fromService:
          type: web
          name: osun-eduos-api
          envVarKey: JWT_ACCESS_SECRET
      # The API over Render's private network.
      - key: API_URL
        fromService:
          type: web
          name: osun-eduos-api
          property: hostport
