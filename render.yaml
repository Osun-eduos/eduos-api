# Render Blueprint for an Osun EduOS pilot: database, API, sync service and web app.
# In Render: New > Blueprint > choose this repository. Render asks for the values marked `sync: false`.
# Guide: https://github.com/Osun-eduos/osun-eduos/blob/main/docs/deployment.md
#
# Addresses (if Render gives a service a different address because the name is taken, update the web app's
# /api rewrite below, WEB_ORIGIN, and the mobile app's server addresses):
#   Web app:       https://osun-eduos-web.onrender.com
#   API:           https://osun-eduos-api.onrender.com
#   Sync service:  https://osun-eduos-sync.onrender.com

databases:
  - name: osun-eduos-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: eduos
    user: eduos
    # Reachable only from these services over Render's private network.
    ipAllowList: []

services:
  - type: web
    name: osun-eduos-api
    runtime: docker
    repo: https://github.com/Osun-eduos/eduos-api
    branch: main
    region: frankfurt
    plan: 0.5c-512mb
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: osun-eduos-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://osun-eduos-web.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: LOGIN_RATE_LIMIT
        value: "60"
      # First Ministry administrator, created on first start only. Choose a temporary password; it must be
      # changed at first sign-in. Delete these three values in Render after signing in.
      - key: SEED_ADMIN_NAME
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: osun-eduos-sync
    runtime: docker
    repo: https://github.com/Osun-eduos/eduos-sync
    branch: main
    region: frankfurt
    plan: 0.5c-512mb
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: osun-eduos-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        fromService:
          type: web
          name: osun-eduos-api
          envVarKey: JWT_ACCESS_SECRET
      # The API over Render's private network.
      - key: API_URL
        fromService:
          type: web
          name: osun-eduos-api
          property: hostport

  - type: web
    name: osun-eduos-web
    runtime: static
    repo: https://github.com/Osun-eduos/eduos-web
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # The browser talks to the API through the web app's own address, so the sign-in cookie stays first-party.
      - type: rewrite
        source: /api/*
        destination: https://osun-eduos-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Robots-Tag
        value: noindex
