name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eduos
          POSTGRES_PASSWORD: eduos
          POSTGRES_DB: eduos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eduos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eduos:eduos@localhost:5432/eduos_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint:types
      - run: npm run build
      - run: npm run test:e2e
