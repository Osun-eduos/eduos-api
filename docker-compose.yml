# Local development: PostgreSQL only. Run the API with `npm run start:dev`.
# Full stack: `docker compose --profile app up --build`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduos
      POSTGRES_PASSWORD: eduos
      POSTGRES_DB: eduos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduos"]
      interval: 5s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eduos:eduos@db:5432/eduos?schema=public
      # Make a key with `npm run keys` and put JWT_PRIVATE_KEY in .env next to this file.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"

volumes:
  pgdata:
